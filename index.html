<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gutierrez Landscaping & More</title>
  <style>html,body{margin:0;min-height:100%;background:#101713;color:#f7f5ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.guti-loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.guti-loading strong{font-size:18px;letter-spacing:.04em}.guti-loading span{display:block;margin-top:8px;font-size:13px;opacity:.7}</style>
</head>
<body>
  <div class="guti-loading"><div><strong>Gutierrez Landscaping &amp; More</strong><span>Loading…</span></div></div>
  <script>
  (async function () {
    const projectCss = String.raw`
/* Gutierrez real-project showcase */
#our-work.guti-work{background:#f7f5ef;color:#101713;padding:clamp(64px,8vw,112px) 24px;position:relative;overflow:hidden}
#our-work.guti-work *{box-sizing:border-box}
#our-work .guti-work-inner{width:min(1180px,100%);margin:0 auto}
#our-work .guti-kicker{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#176a4b}
#our-work .guti-work-title{margin:0;font:800 clamp(38px,6vw,74px)/.96 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.045em;max-width:760px;color:#101713}
#our-work .guti-work-intro{max-width:650px;margin:22px 0 0;font-size:clamp(16px,1.5vw,19px);line-height:1.65;color:#4d5752}
#our-work .guti-rule{height:1px;background:#cfd5d1;margin:clamp(44px,6vw,74px) 0}
#our-work .guti-project{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.68fr);gap:clamp(30px,5vw,72px);align-items:start}
#our-work .guti-project + .guti-project{margin-top:clamp(76px,10vw,132px)}
#our-work .guti-project-meta{position:sticky;top:96px;padding-top:4px}
#our-work .guti-project-no{display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;font-size:12px;font-weight:800;letter-spacing:.16em;color:#176a4b;text-transform:uppercase}
#our-work .guti-project-no:before{content:"";width:30px;height:2px;background:#f2c94c;display:block}
#our-work .guti-project-name{margin:0;font-size:clamp(27px,3vw,42px);line-height:1.05;letter-spacing:-.035em;color:#101713}
#our-work .guti-project-copy{margin:18px 0 0;font-size:16px;line-height:1.65;color:#59625e;max-width:330px}
#our-work .guti-visuals{display:grid;grid-template-columns:minmax(140px,.67fr) minmax(250px,1.33fr);gap:18px;align-items:end}
#our-work figure{margin:0;position:relative}
#our-work .guti-photo{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#dfe3df;box-shadow:0 20px 48px rgba(16,23,19,.12)}
#our-work .guti-before{transform:translateY(-22px)}
#our-work .guti-before .guti-photo{aspect-ratio:3/4;box-shadow:0 14px 30px rgba(16,23,19,.10)}
#our-work .guti-photo-label{position:absolute;left:12px;top:12px;z-index:2;padding:7px 10px;border-radius:999px;background:rgba(16,23,19,.88);color:#fff;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(6px)}
#our-work .guti-after .guti-photo-label{background:#176a4b}
#our-work .guti-caption{margin:11px 2px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#727b77}
#our-work .guti-after .guti-caption{color:#176a4b}
#our-work .guti-project:nth-of-type(2) .guti-visuals{grid-template-columns:minmax(250px,1.33fr) minmax(140px,.67fr)}
#our-work .guti-project:nth-of-type(2) .guti-after{order:1}
#our-work .guti-project:nth-of-type(2) .guti-before{order:2;transform:translateY(24px)}
#our-work .guti-project:nth-of-type(2) .guti-before .guti-photo{aspect-ratio:4/3}
@media (max-width:800px){
  #our-work.guti-work{padding:64px 18px 72px}
  #our-work .guti-rule{margin:40px 0 48px}
  #our-work .guti-project{grid-template-columns:1fr;gap:30px}
  #our-work .guti-project-meta{position:static}
  #our-work .guti-project-copy{max-width:620px}
  #our-work .guti-visuals,#our-work .guti-project:nth-of-type(2) .guti-visuals{grid-template-columns:.76fr 1.24fr;gap:10px;align-items:end}
  #our-work .guti-before,#our-work .guti-project:nth-of-type(2) .guti-before{transform:none;order:1}
  #our-work .guti-after,#our-work .guti-project:nth-of-type(2) .guti-after{order:2}
  #our-work .guti-photo{border-radius:8px}
  #our-work .guti-project + .guti-project{margin-top:78px}
}
@media (max-width:480px){
  #our-work .guti-visuals,#our-work .guti-project:nth-of-type(2) .guti-visuals{grid-template-columns:1fr}
  #our-work .guti-before,#our-work .guti-project:nth-of-type(2) .guti-before{width:72%;justify-self:start}
  #our-work .guti-after,#our-work .guti-project:nth-of-type(2) .guti-after{width:100%}
  #our-work .guti-photo{aspect-ratio:4/5}
}
@media (prefers-reduced-motion:reduce){#our-work *{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
`;

    const projectHtml = String.raw`
<section id="our-work" class="guti-work" aria-labelledby="guti-work-heading">
  <div class="guti-work-inner">
    <p class="guti-kicker">Real work. Real results.</p>
    <h2 id="guti-work-heading" class="guti-work-title">See the difference.</h2>
    <p class="guti-work-intro">Real projects, real transformations — finished with the clean, deliberate detail we bring to every property.</p>
    <div class="guti-rule" aria-hidden="true"></div>

    <article class="guti-project">
      <div class="guti-project-meta">
        <p class="guti-project-no">01 — Featured Project</p>
        <h3 class="guti-project-name">Precision Hedge Care</h3>
        <p class="guti-project-copy">Clean lines. Consistent shaping. A finished look that transforms the property.</p>
      </div>
      <div class="guti-visuals" aria-label="Precision Hedge Care before and after">
        <figure class="guti-before">
          <span class="guti-photo-label">Before</span>
          <img class="guti-photo" src="./assets/precision-hedge-before.webp" alt="Hedge line before the final cleanup and shaping" loading="lazy" decoding="async">
          <figcaption class="guti-caption">Before</figcaption>
        </figure>
        <figure class="guti-after">
          <span class="guti-photo-label">After</span>
          <img class="guti-photo" src="./assets/precision-hedge-after.webp" alt="Finished row of carefully shaped hedges" loading="lazy" decoding="async">
          <figcaption class="guti-caption">Finished result</figcaption>
        </figure>
      </div>
    </article>

    <article class="guti-project">
      <div class="guti-project-meta">
        <p class="guti-project-no">02 — Project</p>
        <h3 class="guti-project-name">Landscape Bed Refresh</h3>
        <p class="guti-project-copy">Trimmed shrubs, defined beds, fresh mulch, and a cleaner overall presentation.</p>
      </div>
      <div class="guti-visuals" aria-label="Landscape Bed Refresh before and after">
        <figure class="guti-before">
          <span class="guti-photo-label">Before</span>
          <img class="guti-photo" src="./assets/landscape-bed-before.webp" alt="Landscape bed and shrubs before the refresh" loading="lazy" decoding="async">
          <figcaption class="guti-caption">Before</figcaption>
        </figure>
        <figure class="guti-after">
          <span class="guti-photo-label">After</span>
          <img class="guti-photo" src="./assets/landscape-bed-after.webp" alt="Refreshed landscape beds with trimmed shrubs and fresh dark mulch" loading="lazy" decoding="async">
          <figcaption class="guti-caption">Finished result</figcaption>
        </figure>
      </div>
    </article>
  </div>
</section>`;

    function closestSectionForServices(doc) {
      const direct = doc.querySelector('#services,[data-section="services"]');
      if (direct) return direct;
      const headings = [...doc.querySelectorAll('h1,h2,h3,h4')];
      const h = headings.find(el => /^\s*(our\s+)?services\s*$/i.test(el.textContent || '') || /services/i.test(el.textContent || ''));
      if (h) return h.closest('section') || h.closest('main > div') || h.parentElement;
      const sections = [...doc.querySelectorAll('section')];
      return sections.find(s => /\bservices\b/i.test((s.textContent || '').slice(0,500))) || null;
    }

    try {
      const response = await fetch('./site-base.html', {cache:'no-store'});
      if (!response.ok) throw new Error('Base site could not be loaded');
      const source = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(source, 'text/html');

      const oldWork = doc.querySelector('#our-work.guti-work');
      if (oldWork) oldWork.remove();

      const style = doc.createElement('style');
      style.id = 'guti-project-showcase-styles';
      style.textContent = projectCss;
      doc.head.appendChild(style);

      const holder = doc.createElement('div');
      holder.innerHTML = projectHtml.trim();
      const work = holder.firstElementChild;

      const services = closestSectionForServices(doc);
      if (services && services.parentNode) services.insertAdjacentElement('afterend', work);
      else (doc.querySelector('main') || doc.body).appendChild(work);

      [...doc.querySelectorAll('a')].forEach(a => {
        const label = (a.textContent || '').replace(/\s+/g,' ').trim();
        if (/^(our\s+work|work|projects)$/i.test(label)) a.setAttribute('href','#our-work');
      });

      document.open();
      document.write('<!doctype html>\n' + doc.documentElement.outerHTML);
      document.close();
    } catch (err) {
      document.body.innerHTML = '<div class="guti-loading"><div><strong>Gutierrez Landscaping &amp; More</strong><span>The website could not load. Please refresh the page.</span></div></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
